[package]
name = "indodax-sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
ccxt = { path = "../vendor/ccxt/rust/ccxt", default-features = false, features = ["indodax"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
